[workspace]
resolver = "2"
members = [
    "crates/skyward",
    "crates/skyward-config",
    "crates/skyward-block",
    "crates/skyward-vab",
    "crates/skyward-modules",
    "crates/skyward-ui",
    "crates/skyward-crypto",
    "crates/skyward-preview",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
libc = "0.2.175"
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
