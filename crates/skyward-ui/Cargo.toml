[package]
name = "skyward-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
ab_glyph = "0.2.32"
# The recovery carries no time zone files, so the rules come built in.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
skyward-info = { path = "../skyward-info" }
skyward-install = { path = "../skyward-install" }
skyward-vab = { path = "../skyward-vab" }
ttf-parser = "0.25.1"
vt100 = "0.18.1"

[target.'cfg(target_os = "android")'.dependencies]
drm = "0.15.0"
drm-ffi = "0.9.1"
libc = { workspace = true }
