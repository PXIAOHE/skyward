[package]
name = "skyward"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "skyward"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.5.51", features = ["derive"] }
skyward-config = { path = "../skyward-config" }
skyward-block = { path = "../skyward-block" }
skyward-vab = { path = "../skyward-vab" }
skyward-modules = { path = "../skyward-modules" }
skyward-info = { path = "../skyward-info" }
skyward-sys = { path = "../skyward-sys" }
skyward-lp = { path = "../skyward-lp" }

[target.'cfg(target_os = "android")'.dependencies]
evdev = "0.13.2"
libc = { workspace = true }
skyward-ui = { path = "../skyward-ui" }
