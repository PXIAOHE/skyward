[device]
codename = "ishtar"
brand = "Xiaomi"
model = "Xiaomi 13 Ultra"
ab = true
soc = "第二代骁龙®8移动平台"
os_version_prop = "ro.mi.os.version.incremental"

[display]
width = 1440
height = 3200
density = 560
diagonal = 6.73
# rounded_corner_radius in the system's DevicesAndroidOverlay.
corner_radius = 140

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor"]
# The touchscreen: ST FTS over SPI. Its firmware, st_fts_m1.ftb, is read
# from /odm/firmware.
load = ["fts_touch_spi"]

# The panel hands raw frames to the host. touch_report turns them into
# touches on the fts input device; touchsensor tells water, gloves and
# screen protectors apart with the models in /odm/firmware.
[[service]]
path = "/odm/bin/touch_report"

[[service]]
path = "/odm/bin/touchsensor"
libraries = ["/odm/lib64", "/system/lib64"]

# The secure world reaches back into Android through the listeners this
# daemon registers; without them the key service cannot use any key.
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"

# The key service, which is the only thing that can use the keys the phone
# wrapped in hardware.
[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"

# The directory the phone's hardware services of the older kind register
# with. A recovery carries none of it, so it is the installed system's own
# program, running against the installed system's own libraries. It says it
# is up by the property the services themselves wait on.
[[service]]
path = "/mnt/system_ext/bin/hwservicemanager"
libraries = ["/mnt/system/system/lib64/bootstrap", "/mnt/system/system/lib64", "/mnt/system_ext/lib64"]
ready_property = "hwservicemanager.ready"

# The credential service: it is what the secure world has check a screen
# lock, and the only thing that can hand out the note the key service wants
# before it will use a key a screen lock guards.
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper@1.0-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.gatekeeper@1.0::IGatekeeper/default"

# The boot control, which says which slot the bootloader starts next and
# switches it, writing where the bootloader reads it. It comes last: the
# phone is usable without it.
[[service]]
path = "/vendor/bin/hw/android.hardware.boot@1.2-service"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.boot@1.2::IBootControl/default"

# WLAN: the WCN7850 on PCIe, driven by qca_cld3_kiwi_v2 over the cnss2
# platform driver. Once fs_ready is written, cnss2 powers the chip up and
# loads its firmware, and wlan0 appears. The driver reads its settings and
# the MAC address through the firmware loader; the vendor partition keeps
# both as links in its own firmware folder, which a recovery covers with
# the modem's, so they are given to the loader again: the settings from
# the vendor partition, the address from persist. wpa_supplicant runs on
# the recovery's own libraries, with libnl and its own interface library
# from the vendor interface's bundle.
[wlan]
modules = ["qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/kiwi_v2/wlan_mac.bin", partition = "persist", path = "kiwi_v2/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/vendor/lib64", "/system/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# qcom-hv-haptics. Waveform 0 is the click: 8 pattern samples at 6667 µs
# each (its debugfs entry, haptics/effect0). Qualcomm's vibrator HAL plays
# its light strength at half of a waveform's drive and its strong one at
# the whole of it.
[haptics]
click = 0
strength = { lightest = 0.5, strongest = 1.0 }

# The partitions a backup of the baseband and EFS takes: the baseband's
# settings, with the IMEI, and the sensors' calibration. And what of the
# data partition a backup leaves out because the secure world keeps it in
# step with itself: its own storage, its apps' data and the fingerprint
# templates.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = ["vendor/tzstorage", "vendor/qtee", "vendor/fingerprint", "vendor/fpc", "vendor/goodix"]

# Where the phone's own programs keep logs in the data partition: the
# system's, the last kernel and logcat lines the diag service saves at each
# start, and what the modem, Wi-Fi and Bluetooth leave when they crash.
[wipe]
logs = [
    "/data/miuilog",
    "/data/vendor/diag",
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wlan_logs",
]
