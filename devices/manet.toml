# Skyward 设备配置 — Redmi K70 Pro（manet / 23117RK66C / SM8650 / pineapple）
#
# 解密链完全移植自 houji（小米14，同 SM8650 / 同 pineapple 平台）的已验证配置
# （skyward-houji-v9.img），作者在其中的诊断结论直接适用：
#   1) qseecom AIDL 服务在本平台必崩（vendor AIDL 要注册到 /dev/vndbinder，
#      recovery 没有 vndservicemanager），改走 qseecomd + keymint 自加载 applet
#   2) recovery 自带 /system/lib64 缺 libvndksupport.so（VNDK 的 libhardware 依赖它），
#      需从已装系统的 /mnt/system/system/lib64 拷到 /kmlibs，
#      并用 LD_CONFIG_FILE 关掉 namespace 隔离
#
# 机型段（device/display/modules/touch/wlan/stock）= manet 实测值

[device]
codename = "manet"
brand = "Redmi"
model = "REDMI K70 Pro"
ab = true
soc = { hans = "第三代骁龙®8移动平台", hant = "Snapdragon® 8 Gen 3 行動平台", en = "Snapdragon® 8 Gen 3 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
width = 1440
height = 3200
density = 560

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# Goodix 触摸（goodix_core + xiaomi_touch）+ NXP eSE 通路（nxp-nci 是连字符，
# 没有独立的 nfc.ko，由依赖带出）。名字必须与 vendor_dlkm 里的 .ko 一致，
# 否则 load_modules 会 fail-fast 中断整条启动链。
load = ["goodix_core", "xiaomi_touch", "stm_nfc_i2c", "nxp-nci"]

[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# 把密钥服务缺的库从已装系统搬到 /kmlibs，关掉 namespace 隔离，
# 并写一个用 LD_CONFIG_FILE 启动程序的包装脚本
[[service]]
path = "/system/bin/sh"
args = ["-c", "mkdir -p /kmlibs && cp /mnt/system/system/lib64/libhardware.so /mnt/system/system/lib64/libvndksupport.so /mnt/system/system/lib64/libnetutils.so /mnt/system/system/lib64/bootstrap/libdl_android.so /kmlibs/ && printf '[recovery]\\nnamespace.default.isolated = false\\n' > /kmlibs/ld.config.txt && printf '#!/system/bin/sh\\nexport LD_CONFIG_FILE=/kmlibs/ld.config.txt\\nexec \"$@\"\\n' > /kmlibs/km.sh && chmod 755 /kmlibs/km.sh && V=$(ls -d /system_dlkm/lib/modules/*/kernel/net/rfkill 2>/dev/null | head -1) && mount --bind $V/rfkill.ko /system_dlkm/flatten/lib/modules/rfkill.ko || true"]
oneshot = true
user = "root"
groups = ["root"]

# gatekeeper 需要的属性 + 槽位符号链接
[[service]]
path = "/system/bin/sh"
args = ["-c", "setprop vendor.gatekeeper.disable_spu true; setprop vendor.gatekeeper.is_security_level_spu 0; setprop ro.boot.slot_suffix _b; ln -sf boot_b /dev/block/by-name/boot; true"]
oneshot = true
user = "root"
groups = ["root"]

# 安全世界回连（带 init 的 notify-topology socket）
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/vendor/lib64", "/vendor/lib64/hw", "/system/lib64", "/odm/lib64"]
sockets = ["notify-topology"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

# 安全服务网关（TEE 回调入口）
[[service]]
path = "/vendor/bin/ssgtzd"
libraries = ["/kmlibs", "/vendor/lib64", "/vendor/lib64/hw", "/system/lib64", "/odm/lib64"]
sockets = ["ssgtzd", "ssgtzd_opener"]
user = "root"
groups = ["root", "system", "drmrpc"]
capabilities = ["WAKE_ALARM", "BLOCK_SUSPEND"]

# 密钥服务
[[service]]
path = "/kmlibs/km.sh"
args = ["/vendor/bin/hw/android.hardware.security.keymint-service-qti"]
libraries = ["/kmlibs", "/vendor/lib64", "/vendor/lib64/hw", "/system/lib64", "/odm/lib64"]
registers = [
    "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "root"
groups = ["root", "drmrpc"]

# 凭据服务（AIDL 版，需要 VINTF 描述）
[[service]]
path = "/kmlibs/km.sh"
args = ["/vendor/bin/hw/android.hardware.gatekeeper-service-qti"]
libraries = ["/kmlibs", "/vendor/lib64", "/vendor/lib64/hw", "/system/lib64", "/odm/lib64"]
ready_service = "android.hardware.gatekeeper.IGatekeeper/default"
description = "/vendor/etc/vintf/manifest_pineapple.xml"
user = "root"
groups = ["root", "drmrpc"]

# 启动槽位
[[service]]
path = "/vendor/bin/hw/android.hardware.boot-service.qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.boot.IBootControl/default"
user = "root"
groups = ["root"]

# NXP eSE 的 weaver（放最后，起不来也不挡前面）
[[service]]
path = "/kmlibs/km.sh"
args = ["/odm/bin/hw/android.hardware.weaver-service.nxp-qti"]
libraries = ["/kmlibs", "/odm/lib64", "/vendor/lib64", "/system/lib64", "/mnt/system/system/lib64/bootstrap"]
ready_service = "android.hardware.weaver.IWeaver/default"
manifest = '''<manifest version="1.0" type="device"><hal format="aidl"><name>android.hardware.weaver</name><version>2</version><fqname>IWeaver/default</fqname></hal></manifest>'''
user = "root"
groups = ["root", "drmrpc"]

[wlan]
modules = ["rfkill", "qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
    # mac 在 persist/kiwi_v2/ 下（实测确认）
    { name = "wlan/qca_cld/kiwi_v2/wlan_mac.bin", path = "/mnt/vendor/persist/kiwi_v2/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/vendor/lib64", "/system/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# TEE applet 存在 modem 分区
[firmware]
partition = "modem"

[partitions]
mounted = ["persist"]

[update]
server = "https://update.miui.com/updates/miotaV3.php"

[stock]
version = "OS3.0.306.0.WNMCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.306.0.WNMCNXM/manet-ota_full-OS3.0.306.0.WNMCNXM-user-16.0-5d044d135d.zip"
recovery = "4a39faaf69631db5d773b296356ec472917e9577c89696e08e94d3369bc92e56"

[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }