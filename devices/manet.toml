[device]
codename = "manet"
brand = "Redmi"
model = "REDMI K70 Pro"
ab = true
soc = { hans = "第三代骁龙®8移动平台", hant = "Snapdragon® 8 Gen 3 行動平台", en = "Snapdragon® 8 Gen 3 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
width = 1440
height = 3200
density = 560

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# Touch: Goodix (goodix_core from vendor, xiaomi_touch depends on it)
# NFC/eSE: the weaver reaches the secure element through /dev/nq-nci, so these three are needed
load = ["goodix_core", "xiaomi_touch", "nxp_nci", "stm_nfc_i2c", "nfc"]

# As on zorn: let the driver report positions itself, without libtouchreport.so
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# The kernel's post boot script, as zorn runs it
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# ===== the four services that open the data partition =====

# 1) the secure world reaching back into Android
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

# 2) the key service
[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
user = "system"
groups = ["system", "drmrpc"]

# 3) the credential check (AIDL here; ishtar's is HIDL and uses ready_hardware_service)
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.gatekeeper.IGatekeeper/default"
user = "system"
groups = ["system", "drmrpc"]

# 4) NXP's weaver on this phone's secure element
[[service]]
path = "/odm/bin/hw/android.hardware.weaver-service.nxp-qti"
libraries = ["/odm/lib64", "/system/lib64"]
ready_service = "android.hardware.weaver.IWeaver/default"
user = "vendor_nxp_weaver"
groups = ["system", "drmrpc"]

[wlan]
modules = ["rfkill", "qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/kiwi_v2/wlan_mac.bin", partition = "persist", path = "wlan/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: OS3.0.306.0's full package on the
# maker's own download server. Its payload manifest names the recovery
# partition's SHA-256, taken out below at build time.
[stock]
version = "OS3.0.306.0.WNMCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.306.0.WNMCNXM/manet-ota_full-OS3.0.306.0.WNMCNXM-user-16.0-5d044d135d.zip"
recovery = "4a39faaf69631db5d773b296356ec472917e9577c89696e08e94d3369bc92e56"

[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }