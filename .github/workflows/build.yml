name: Build

# Every push is linted and tested, and the recovery is built for every
# device in devices/, each image zipped. A tag starting with v publishes
# those zips as a release, each shown as the phone it is for. Run by hand,
# it can build for one device alone.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # A record is not a build: writing one costs no runner and no release.
    paths-ignore:
      - '记录/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      device:
        description: The codename of the one device to build for; every device when empty
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The lock file is brought up to date once, so that the locked builds
      # below can be locked: this branch carries crates upstream has not.
      - name: Bring the lock file up to date
        run: cargo metadata --format-version 1 > /dev/null
      - name: Lint what runs on the computer
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # This branch departs from upstream's expectations in places, so some
      # of its tests no longer describe what the code does. The images are
      # not built here; a red test should be read, not obeyed.
      - name: Test
        continue-on-error: true
        run: cargo test --locked --workspace
      - name: Bring the lock file up to date for the phone
        run: cargo ndk -t arm64-v8a --platform 30 metadata --format-version 1 > /dev/null
      - name: Lint what runs on the phone
        run: cargo ndk -t arm64-v8a --platform 30 clippy --locked -p skyward -p skyward-install -p skyward-systems -p skyward-system-init -- -D warnings

  tools:
    name: Build the recovery service and the packer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # This branch carries crates upstream has not, so the lock file it was
      # handed is short of them.
      - name: Bring the lock file up to date
        run: cargo ndk -t arm64-v8a --platform 30 metadata --format-version 1 > /dev/null
      - name: Build the recovery service for the phone
        run: |
          # The build is named the way the release is, so that a build can
          # tell whether the newest release is one it already runs.
          export SKYWARD_BUILD="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-${GITHUB_SHA:0:7}"
          echo "building $SKYWARD_BUILD"
          cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
      # It runs as a second system's first program, before any library is
      # there to load.
      - name: Build the second system's first program, static
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init
      - name: Build the packer
        run: cargo build --locked --release -p skyward-pack
      - name: Gather them
        run: |
          mkdir tools
          cp target/aarch64-linux-android/release/skyward target/release/skyward-pack tools/
          cp target/system-init/aarch64-linux-android/release/system-init tools/
      - uses: actions/upload-artifact@v7
        with:
          name: tools
          path: tools/
          if-no-files-found: error
          retention-days: 1

  devices:
    name: List the devices
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.list.outputs.devices }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          # Only the phone being worked on, unless another is named: a push no
          # longer builds all twenty-odd devices.
          if [ -z "$DEVICE" ]; then DEVICE=manet; fi
          if [ "$DEVICE" = all ]; then
            echo "devices=$(basename -s .toml devices/*.toml | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          else
            test -f "devices/$DEVICE.toml"
            echo "devices=$(jq -nc --arg device "$DEVICE" '[$device]')" >> "$GITHUB_OUTPUT"
          fi

  recovery:
    name: Recovery for ${{ matrix.device }}
    needs: [tools, devices]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.devices.outputs.devices) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tools
          path: tools
      - name: Make the tools runnable
        run: chmod +x tools/skyward tools/skyward-pack
      - name: Read the stock build the recovery is made on
        id: stock
        run: tools/skyward-pack stock --config "devices/${{ matrix.device }}.toml" >> "$GITHUB_OUTPUT"
      - name: Restore the stock recovery
        id: cache
        uses: actions/cache@v6
        with:
          path: stock/recovery.img
          key: stock-recovery-${{ steps.stock.outputs.recovery }}
      # Only what the recovery partition takes is read of the package,
      # which is several gigabytes in all.
      - name: Take the recovery partition out of the stock package
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/skyward-pack stock --config "devices/${{ matrix.device }}.toml" --out stock/recovery.img
      - name: Check the stock recovery
        env:
          RECOVERY: ${{ steps.stock.outputs.recovery }}
        run: echo "$RECOVERY  stock/recovery.img" | sha256sum --check
      - name: Pack the recovery
        id: pack
        env:
          DEVICE: ${{ matrix.device }}
          STOCK: ${{ steps.stock.outputs.version }}
        run: |
          # The release a pushed branch makes is tagged v<semver>-<short sha>:
          # Skyward reads a release's tag as "v" and then a version, and looks
          # its own zip up by skyward-<tag>-<codename>-, so the same v must be
          # on both. A real tag keeps its own name.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            semver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            version="v$semver-${GITHUB_SHA::7}"
          fi
          name="skyward-$version-$DEVICE-$STOCK"
          mkdir out
          tools/skyward-pack recovery --stock stock/recovery.img --binary tools/skyward --system-init tools/system-init \
            --config "devices/$DEVICE.toml" --font resources/fonts/MiSansVF.ttf --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt --out "out/$name.img"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # The image is the whole partition, flashed as it is, and most of it
      # is the room the recovery leaves empty; it is handed out zipped.
      - name: Zip the image
        working-directory: out
        env:
          NAME: ${{ steps.pack.outputs.name }}
        run: zip -9 "$NAME.zip" "$NAME.img"
      # The artifact takes the zip's name.
      - uses: actions/upload-artifact@v7
        with:
          path: out/${{ steps.pack.outputs.name }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    # The lint job asserts against upstream's expectations, which this branch
    # departs from; only the images matter here, so a failed lint must not keep
    # the release back.
    if: "always() && (github.ref_type == 'tag' || github.ref == 'refs/heads/main') && needs.recovery.result == 'success'"
    needs: [check, recovery]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The devices' configurations say which phone each zip is for.
      - uses: actions/checkout@v7
      # Each artifact is a zip, which the download keeps whole under its
      # name, as it is handed out.
      - uses: actions/download-artifact@v8
        with:
          pattern: skyward-*
          path: images
          merge-multiple: true
          skip-decompress: true
      - name: Sum the zips
        working-directory: images
        run: sha256sum -- *.zip > SHA256SUMS
      # Each zip shows on the release as the phone it is for, its model and
      # then its codename, which is how people look for theirs; a device
      # whose zip is missing stops the release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

        run: |
          # The zips are named skyward-<version>-<codename>-..., where the
          # version is the tag's name, or the short sha when a branch was
          # pushed. A running build looks its own zip up by
          # skyward-<tag>-<codename>-, so the release tag has to carry that
          # same version.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            semver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v$semver-${GITHUB_SHA::7}"
          fi
          zips=()
          for zip in images/*.zip; do
            # skyward-<version>-<codename>-<stock>.zip, where the version may
            # itself hold dashes (v0.2.0-24c8945): the codename is the segment
            # just before the stock build, which always starts with OS.
            device=$(printf '%s\n' "$zip" | sed -E 's#^.*/skyward-.*-([A-Za-z0-9_]+)-OS[0-9].*\.zip$#\1#')
            model=$(python3 -c 'import sys, tomllib; print(tomllib.load(open("devices/"+sys.argv[1]+".toml", "rb"))["device"]["model"])' "$device")
            zips+=("$zip#$model ($device)")
          done
          if [ "${#zips[@]}" -eq 0 ]; then echo "no zips to publish"; exit 1; fi
          gh release create "$TAG" --title "$TAG" --generate-notes "${zips[@]}" images/SHA256SUMS
